site_name: Evolution for Everyone
site_url: https://evolution-for-everyone.github.io
theme:
  name: material 
  font: 
    text: Roboto
    code: Red Hat Mono
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top

  palette:

  # Automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

  # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: lime
  
  # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: purple
      accent: deep purple
  
nav:
  - Section:
    - tutorials/index.md 
    - Tutorial 0: tutorials/tutorial_0.md
    - Tutorial 1: tutorials/tutorial_1.md
    - Tutorial 2: tutorials/tutorial_2.md
    - Tutorial 3: tutorials/tutorial_3.md
    - Tutorial 4: tutorials/tutorial_4.md
    - Tutorial 5: tutorials/tutorial_5.md
    - Tutorial 6: tutorials/tutorial_6.md


markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - nl2br

plugins:
  - search