site_name: Evolution for Everyone
site_url: https://evolution-for-everyone.github.io
theme:
  name: material 
  font: 
    text: Roboto
    code: Red Hat Mono
  nav:
  - Home: index.md
  - About: about.md
  - Tutorials:
    - Tutorial 1 Introduction to command line and bash: tutorial_1.md
    - Tutorial 2 Working on a server: tutorial_2.md
    - Tutorial 3 Downloading genomic sequences: tutorial_3.md
    - Tutorial 4 Building sequence alignments: tutorial_4.md
    - Tutorial 5 Phylogenetic trees: tutorial_5.md
    - Tutorial 6 Codon models: tutorial_6.md

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress

  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: purple
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: deep purple
  
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - nl2br
